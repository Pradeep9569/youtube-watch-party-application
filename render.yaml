# Optional Render Blueprint. Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: youtube-watch-party-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
